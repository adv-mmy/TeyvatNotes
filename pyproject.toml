[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-foundation"
version = "0.1.0"
description = "用于学习可靠 Agent Runtime 基础能力的 Python 项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_foundation"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
include = ["main.py", "src/**/*.py", "tests/**/*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
files = ["main.py", "src"]
mypy_path = "src"
python_version = "3.12"
strict = true

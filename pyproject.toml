[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-foundation"
version = "0.8.1"
description = "用于学习可靠 Agent Runtime 基础能力的 Python 项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard]",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_foundation"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "postgres: 需要可丢弃的 TEST_DATABASE_URL，会先重建本项目的表",
]

[tool.ruff]
include = ["*.py", "src/**/*.py", "tests/**/*.py", "migrations/**/*.py"]
extend-exclude = ["pytest-cache-files-*"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
files = ["main.py", "api_main.py", "worker_main.py", "src", "scripts"]
mypy_path = "src"
python_version = "3.12"
strict = true

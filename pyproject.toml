[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TeyvatNotes"
version = "0.8.1"
description = "用于学习可靠 Agent Runtime 基础能力的 Python 项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard]",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
desktop = [
    "PySide6-Essentials>=6.10,<7",
    "python-dotenv>=1.2,<2",
]
desktop-build = [
    {include-group = "desktop"},
    "PyInstaller>=6.19,<7; sys_platform == 'win32'",
]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teyvatnotes"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "postgres: 需要可丢弃的 TEST_DATABASE_URL，会先重建本项目的表",
]

[tool.ruff]
include = ["*.py", "src/**/*.py", "tests/**/*.py", "migrations/**/*.py"]
extend-exclude = ["pytest-cache-files-*"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
files = ["main.py", "api_main.py", "worker_main.py", "src", "scripts"]
mypy_path = "src"
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "teyvatnotes.desktop.ui",
    "teyvatnotes.desktop.widgets",
    "teyvatnotes.desktop.worker",
]
disallow_subclassing_any = false

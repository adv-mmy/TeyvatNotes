name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码质量与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - name: 按锁文件安装依赖
        run: uv sync --locked --dev
      - name: Ruff 静态检查
        run: uv run ruff check .
      - name: Ruff 格式检查
        run: uv run ruff format --check .
      - name: mypy 严格类型检查
        run: uv run mypy
      - name: 单元与契约测试
        run: uv run pytest -m "not postgres" -q
      - name: 并发基线
        run: uv run python -m scripts.concurrency_baseline --tasks 200 --concurrency 20

  postgres:
    name: 真实 PostgreSQL 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: agent_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_runtime_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/agent_runtime_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/agent_runtime_test
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - name: 按锁文件安装依赖
        run: uv sync --locked --dev
      - name: 执行真实迁移
        run: uv run alembic upgrade head
      - name: PostgreSQL Repository 集成测试
        run: uv run pytest -m postgres -q
      - name: PostgreSQL 租约恢复演示
        run: uv run python -m scripts.postgres_recovery_demo
      - name: 本机独立进程强杀恢复与 SSE 验收
        run: uv run python -m scripts.process_acceptance_demo

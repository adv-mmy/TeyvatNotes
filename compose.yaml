name: agent-runtime-foundation

x-database-url: &database-url "postgresql+asyncpg://${POSTGRES_USER:-agent_runtime}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_runtime}"

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_runtime}
      POSTGRES_USER: ${POSTGRES_USER:-agent_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    restart: "no"

  api:
    build:
      context: .
    environment:
      DATABASE_URL: *database-url
      AGENT_RUNTIME_API_KEY: ${AGENT_RUNTIME_API_KEY:?请在 .env 中设置 AGENT_RUNTIME_API_KEY}
      AGENT_RUNTIME_EXECUTION_MODE: embedded
      AGENT_RUNTIME_WORKER_COUNT: ${AGENT_RUNTIME_WORKER_COUNT:-4}
      AGENT_RUNTIME_MAX_CONCURRENCY: ${AGENT_RUNTIME_MAX_CONCURRENCY:-2}
      AGENT_RUNTIME_TASK_TIMEOUT_SECONDS: ${AGENT_RUNTIME_TASK_TIMEOUT_SECONDS:-30}
      AGENT_RUNTIME_SHUTDOWN_TIMEOUT_SECONDS: ${AGENT_RUNTIME_SHUTDOWN_TIMEOUT_SECONDS:-5}
      AGENT_RUNTIME_RATE_LIMIT_REQUESTS: ${AGENT_RUNTIME_RATE_LIMIT_REQUESTS:-30}
      AGENT_RUNTIME_RATE_LIMIT_WINDOW_SECONDS: ${AGENT_RUNTIME_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${AGENT_RUNTIME_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres-data:
